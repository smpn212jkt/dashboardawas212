<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard AWAS — SMP Negeri 212 Jakarta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/dist/tabler-icons.min.css">
<style>
  :root{
    --color-background-primary:#ffffff;
    --color-background-secondary:#F4F5F7;
    --color-border-secondary:#D9DBE0;
    --color-border-tertiary:#E7E9EC;
    --color-text-primary:#1A1D21;
    --color-text-secondary:#6B7280;
  }
  html,body{margin:0;padding:0;background:#EEF0F3;font-family:'Plus Jakarta Sans',Inter,system-ui,sans-serif}
  .page-wrap{max-width:1180px;margin:0 auto;padding:24px 20px 48px}
</style>

<body>
<div class="page-wrap">

<style>
*{box-sizing:border-box;margin:0;padding:0}
.db{padding:0 0 2rem;font-family:'Plus Jakarta Sans',Inter,system-ui,sans-serif}

/* ===== Header identitas sekolah ===== */
.school-header{position:relative;overflow:hidden;background:linear-gradient(120deg,#0B2545 0%,#123863 55%,#0B2545 100%);border-radius:16px;padding:22px 26px;margin-bottom:1.25rem;color:#fff}
.school-header::before{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(45deg,rgba(201,162,39,0.10) 0 2px,transparent 2px 26px),repeating-linear-gradient(-45deg,rgba(201,162,39,0.06) 0 2px,transparent 2px 26px);pointer-events:none}
.school-header::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(201,162,39,0.22) 0%,transparent 70%);pointer-events:none}
.sh-row{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sh-brand{display:flex;align-items:center;gap:14px}
.sh-emblem{width:52px;height:52px;border-radius:50%;overflow:hidden;flex-shrink:0;box-shadow:0 0 0 3px rgba(201,162,39,0.25),0 2px 6px rgba(0,0,0,0.25);background:#fff}
.sh-emblem img{width:100%;height:100%;object-fit:cover;display:block}
.sh-title{font-size:16px;font-weight:700;letter-spacing:0.4px;text-transform:uppercase;line-height:1.25}
.sh-sub{font-size:12.5px;color:#D9C98A;font-weight:500;margin-top:2px}
.sh-tag{font-size:11px;color:rgba(255,255,255,0.65);margin-top:2px}
.sh-right{display:flex;align-items:center;gap:8px}
.pill-live{display:flex;align-items:center;gap:5px;background:rgba(201,162,39,0.16);border:0.5px solid rgba(201,162,39,0.5);color:#F1DFA0;font-size:11px;font-weight:600;padding:4px 11px;border-radius:20px}
.dot-live{width:6px;height:6px;border-radius:50%;background:#E8C86B;box-shadow:0 0 0 3px rgba(232,200,107,0.25)}
.btn-sm{font-size:12px;padding:6px 13px;border-radius:8px;border:0.5px solid rgba(201,162,39,0.55);background:rgba(255,255,255,0.06);color:#fff;cursor:pointer;display:flex;align-items:center;gap:5px;font-weight:500}
.btn-sm:hover{background:rgba(201,162,39,0.22)}
.sync-label{font-size:11.5px;color:rgba(255,255,255,0.6)}

/* ===== Kartu metrik ===== */
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:1.25rem}
.mcard{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:12px;padding:16px;position:relative;overflow:hidden}
.mcard-accent{position:absolute;top:0;left:0;right:0;height:3px;border-radius:12px 12px 0 0}
.mcard-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.mcard-val{font-size:26px;font-weight:700;line-height:1;margin-bottom:4px}
.mcard-label{font-size:12px;color:var(--color-text-secondary);font-weight:500}
.mcard-delta{font-size:11px;margin-top:6px;display:flex;align-items:center;gap:3px;font-weight:500}
.badge-entri{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;margin-top:6px;background:#EAF0F8;color:#0B2545}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1.25rem}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:12px;padding:1rem 1.25rem}
.card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.card-title{font-size:13px;font-weight:600;color:var(--color-text-secondary);display:flex;align-items:center;gap:6px}
.loc-item{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.loc-label{font-size:12px;color:var(--color-text-secondary);width:110px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc-track{flex:1;height:6px;background:var(--color-background-secondary);border-radius:3px;overflow:hidden}
.loc-fill{height:6px;border-radius:3px}
.loc-num{font-size:12px;font-weight:600;color:var(--color-text-primary);width:20px;text-align:right}
.loc-pct{font-size:11px;color:var(--color-text-secondary);width:32px;text-align:right}
.full-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:12px;padding:1rem 1.25rem}
.tbl-wrap{overflow-x:auto}
table{width:100%;min-width:830px;border-collapse:collapse;font-size:13px;table-layout:fixed}
th{text-align:left;padding:8px 8px;color:var(--color-text-secondary);border-bottom:0.5px solid var(--color-border-tertiary);font-weight:600;font-size:10.5px;white-space:normal;line-height:1.3;text-transform:uppercase;letter-spacing:0.3px;vertical-align:bottom}
td{padding:10px;border-bottom:0.5px solid var(--color-border-tertiary);color:var(--color-text-primary);vertical-align:top}
th:nth-child(2),td:nth-child(2){padding-left:28px}
th:nth-child(3),td:nth-child(3){padding-left:20px}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--color-background-secondary)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 9px;border-radius:6px;font-weight:600}
.chip-menunggu{background:#FBE9EC;color:#8B1E3F}
.chip-diproses{background:#FBF1D8;color:#8A6708}
.chip-selesai{background:#E5F1E6;color:#2F6B3A}
.chip-ditolak{background:#F1F1F1;color:#5B5B5B}
.chip-dot{width:5px;height:5px;border-radius:50%}
.donut-wrap{display:flex;align-items:center;gap:1.5rem}
.donut-legend{display:flex;flex-direction:column;gap:8px;flex:1}
.leg-item{display:flex;align-items:center;justify-content:space-between;font-size:12px}
.leg-left{display:flex;align-items:center;gap:6px;color:var(--color-text-secondary)}
.leg-sq{width:9px;height:9px;border-radius:2px;flex-shrink:0}
.leg-val{font-weight:600;color:var(--color-text-primary)}
.mini-stat{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--color-text-secondary);padding:6px 0;border-bottom:0.5px solid var(--color-border-tertiary)}
.mini-stat:last-child{border-bottom:none}
.mini-stat-val{font-weight:600;color:var(--color-text-primary);margin-left:auto}
.rank-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rank-item{display:flex;align-items:center;gap:10px;padding:12px;border-radius:10px;border:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary)}
.rank-trophy{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rank-name{font-size:13px;font-weight:600;color:var(--color-text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-count{font-size:11px;color:var(--color-text-secondary);font-weight:500}
.rank-pos{font-size:10px;font-weight:700;color:var(--color-text-secondary);letter-spacing:0.3px}
.loading-ring{width:24px;height:24px;border:2px solid var(--color-border-tertiary);border-top-color:#0B2545;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:3rem;color:var(--color-text-secondary);font-size:13px}
.filter-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-bottom:14px}
.filter-item{display:flex;flex-direction:column;gap:3px}
.filter-item label{font-size:10.5px;font-weight:600;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:0.3px}
.filter-item select{font-size:12.5px;padding:6px 9px;border-radius:8px;border:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary);color:var(--color-text-primary);min-width:140px}
.btn-cetak{font-size:12.5px;padding:7px 14px;border-radius:8px;border:0.5px solid var(--color-border-secondary);background:#0B2545;color:#fff;cursor:pointer;font-weight:600;display:flex;align-items:center;gap:6px}
.btn-cetak:hover{background:#123863}
.btn-reset{font-size:12.5px;padding:7px 12px;border-radius:8px;border:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary);color:var(--color-text-secondary);cursor:pointer}
.print-header{display:none}
@media print{
  .no-print{display:none !important}
  .print-header{display:block !important;margin-bottom:14px}
  .full-card{border:none !important;box-shadow:none !important;padding:0 !important}
  .tbl-wrap{overflow:visible !important}
  body{background:#fff !important}
}
</style>

// Peta status resmi mengikuti alur persetujuan JotForm:
// On Submission -> Approval (2 Approvers) -> Ditolak / Disetujui -> Approve & Sign
// -> Aset Rusak Berat | Selesai Tindak Lanjut | Ditangguhkan -> (jika ditangguhkan) Approve & Sign 2
// -> Masuk Rencana Anggaran | Menunggu Jadwal Pemeliharaan -> ... -> Selesai
// Sumber: field "Persetujuan Laporan" (control_radio, nilainya berupa kode kunci
// yang diterjemahkan lewat options_array) dan "Laporan Disetujui".
const STATUS_RULES=[
  {key:'ditolak',label:'Ditolak',match:['ditolak','rejected']},
  {key:'selesai',label:'Selesai',match:['aset rusak berat','rusak berat','rusak total','selesai tindak lanjut','selesai di tl','completed','selesai']},
  {key:'diproses',label:'Diproses',match:['ditangguhkan','masuk rencana anggaran','menunggu jadwal pemeliharaan','in progress']}
];

// Field bertipe radio/dropdown/checkbox di JotForm kadang menyimpan jawaban
// sebagai kode kunci berformat "{keyxxxx}", bukan teks aslinya — teks asli
// baru bisa didapat dengan mencocokkan kode itu ke daftar "options_array" pada field yang sama.
function resolveOptionAnswer(field,raw){
  if(!field.options_array)return raw;
  let optMap;
  try{optMap=JSON.parse(field.options_array);}catch(e){return raw;}
  const s=String(raw);
  const tokens=s.match(/\{([^}]+)\}/g);
  if(tokens){
    return tokens.map(t=>{
      const key=t.slice(1,-1);
      return(optMap[key]&&optMap[key].value)?optMap[key].value:key;
    }).join(', ');
  }
  if(optMap[s]&&optMap[s].value)return optMap[s].value;
  return raw;
}

function getAnswer(ans,kws,excludeKws){
  excludeKws=excludeKws||[];
  for(const k of Object.keys(ans)){
    const field=ans[k];
    const n=(field.text||field.name||'').toLowerCase();
    if(excludeKws.some(ex=>n.includes(ex)))continue;
    for(const kw of kws){
      if(n.includes(kw)){
        let a=field.answer;
        if(!a)continue;
        a=resolveOptionAnswer(field,a);
        if(Array.isArray(a))return a.filter(Boolean).join(', ').trim();
        if(typeof a==='object')return Object.values(a).filter(Boolean).join(' ').trim();
        return String(a).trim();
      }
    }
  }
  return '-';
}

// "Menunggu Persetujuan" = murni tahap Approval pertama (2 Approvers):
// belum ada nilai di "Persetujuan Laporan" DAN "Laporan Disetujui" belum tercentang.
// Kalau sudah disetujui tapi field persetujuan lanjutan masih kosong,
// berarti sudah lolos Approval pertama dan sedang menunggu Approve & Sign (dikategorikan "Diproses").
function deriveStatus(persetujuan,disetujui){
  const p=(persetujuan||'').toLowerCase();
  for(const r of STATUS_RULES){
    if(r.match.some(kw=>p.includes(kw)))return{key:r.key,label:r.label};
  }
  const d=(disetujui||'').toLowerCase();
  const sudahDisetujui=d&&d!=='-'&&!['tidak','no','false','belum','0'].some(kw=>d.includes(kw));
  if(sudahDisetujui){
    return{key:'diproses',label:'Diproses'};
  }
  return{key:'menunggu',label:'Menunggu Persetujuan'};
}


function formatTanggal(raw){
  if(!raw||raw==='-')return '-';
  const clean=raw.replace(/\s*\d{1,2}:\d{2}(:\d{2})?\s*/g,' ').trim();
  const nums=clean.match(/\d+/g);
  if(nums&&nums.length>=3){
    const yIdx=nums.findIndex(n=>n.length===4);
    if(yIdx>=0){
      const y=nums[yIdx];
      const rest=nums.filter((_,i)=>i!==yIdx);
      if(rest.length>=2)return`${rest[0].padStart(2,'0')}/${rest[1].padStart(2,'0')}/${y}`;
    }
  }
  return clean||'-';
}

function getFileUrls(ans,kws,excludeKws){
  excludeKws=excludeKws||[];
  for(const k of Object.keys(ans)){
    const field=ans[k];
    const n=(field.text||field.name||'').toLowerCase();
    if(excludeKws.some(ex=>n.includes(ex)))continue;
    for(const kw of kws){
      if(n.includes(kw)){
        const a=field.answer;
        if(!a)return[];
        if(Array.isArray(a))return a.filter(Boolean);
        return[String(a)];
      }
    }
  }
  return[];
}

function mapSub(s){
  const a=s.answers||{};
  const persetujuan=getAnswer(a,['persetujuan laporan','persetujuan']);
  const disetujui=getAnswer(a,['laporan disetujui','disetujui']);
  const st=deriveStatus(persetujuan,disetujui);
  return{
    id:s.id||'',
    nama:getAnswer(a,['nama pelapor','nama'])||'Anonim',
    kontak:getAnswer(a,['email atau nomor','email','nomor']),
    lokasi:getAnswer(a,['lokasi fasilitas','lokasi','location']),
    fasilitas:getAnswer(a,['fasilitas yang rusak','fasilitas','facility','sarana'],['lokasi']),
    deskripsi:getAnswer(a,['deskripsi kerusakan','deskripsi','keterangan','detail','uraian']),
    kronologi:getAnswer(a,['kronologi']),
    tindakLanjut:getAnswer(a,['tindak lanjut']),
    tindakLanjutFotos:getFileUrls(a,['tindak lanjut']),
    keterangan:getAnswer(a,['keterangan'],['lokasi','fasilitas']),
    tanggal:formatTanggal(getAnswer(a,['tanggal kerusakan','tanggal','date'])||((s.created_at||'').split(' ')[0])),
    created:s.created_at||'',
    persetujuanRaw:persetujuan,
    status:st.key,
    statusLabel:st.label
  };
}

function av(name){
  const c=AV_COLORS[name.charCodeAt(0)%AV_COLORS.length];
  const p=name.trim().split(' ');
  const i=((p[0]?.[0]||'')+(p[1]?.[0]||'')).toUpperCase()||'?';
  return{c,i};
}

      <tbody>${rowsHtml}</tbody>
    </table>
    <div class="no-print" style="display:flex;align-items:center;justify-content:space-between;padding:12px 4px 2px;font-size:12px;color:var(--color-text-secondary)">
      <span>Menampilkan ${start+1}–${Math.min(start+PAGE_SIZE,reversed.length)} dari ${reversed.length} laporan</span>
      <div style="display:flex;align-items:center;gap:10px">
        <button onclick="currentPage--;render(lastData)" ${currentPage<=1?'disabled':''} style="padding:5px 11px;border-radius:7px;border:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary);color:var(--color-text-primary);font-size:12px;cursor:${currentPage<=1?'default':'pointer'};opacity:${currentPage<=1?'0.4':'1'}">← Sebelumnya</button>
        <span>Halaman ${currentPage} dari ${totalPages}</span>
        <button onclick="currentPage++;render(lastData)" ${currentPage>=totalPages?'disabled':''} style="padding:5px 11px;border-radius:7px;border:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary);color:var(--color-text-primary);font-size:12px;cursor:${currentPage>=totalPages?'default':'pointer'};opacity:${currentPage>=totalPages?'0.4':'1'}">Berikutnya →</button>
      </div>
    </div>`;
    })()}
    </div>
  </div>`;

  if(cMonth)cMonth.destroy();
  if(cDonut)cDonut.destroy();

  const m=document.getElementById('cMonth');
  if(m) cMonth=new Chart(m,{type:'bar',data:{labels:mLbls,datasets:[{label:'Laporan',data:mVals,backgroundColor:'#0B2545',borderRadius:5,borderSkipped:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+c.parsed.y+' laporan'}}},scales:{x:{grid:{display:false},ticks:{color:'#888780',font:{size:11},autoSkip:false,maxRotation:45}},y:{beginAtZero:true,grid:{color:'rgba(136,135,128,0.12)'},ticks:{color:'#888780',font:{size:11},stepSize:1}}}}});

  const dd=document.getElementById('cDonut');
  if(dd) cDonut=new Chart(dd,{type:'doughnut',data:{labels:['Menunggu persetujuan','Ditolak','Diproses','Selesai'],datasets:[{data:[menunggu,ditolak,diproses,selesai],backgroundColor:['#8B1E3F','#8A8A8A','#C9A227','#2F6B3A'],borderWidth:0,hoverOffset:3}]},options:{responsive:true,maintainAspectRatio:false,cutout:'70%',plugins:{legend:{display:false}}}});
}

async function fetchJotform(){
  return fetch(`https://api.jotform.com/form/${FORM_ID}/submissions?apiKey=${API_KEY}&limit=100&orderby=created_at`,{
    headers:{'Accept':'application/json'},
    cache:'no-store'
  });
}

async function init(attempt){
  attempt=attempt||1;
  const MAX_ATTEMPTS=5;
  document.getElementById('syncLabel').textContent=attempt>1?`Mencoba ulang (${attempt}/${MAX_ATTEMPTS})…`:'Memuat…';
  document.getElementById('root').innerHTML=`<div class="empty"><div class="loading-ring"></div>${attempt>1?`Mencoba lagi menghubungkan ke JotForm… (percobaan ${attempt})`:'Mengambil data dari JotForm…'}</div>`;
  try{
    const res=await fetchJotform();
    const json=await res.json();
    const isTemporaryError=json.responseCode>=500&&json.responseCode<600;
    if(json.responseCode!==200){
      if(isTemporaryError&&attempt<MAX_ATTEMPTS){
        await new Promise(r=>setTimeout(r,Math.min(3000*attempt,15000)));
        return init(attempt+1);
      }
      document.getElementById('root').innerHTML=`<div class="empty" style="color:#A32D2D;background:#FCEBEB;border-radius:12px"><i class="ti ti-alert-triangle" style="font-size:22px;display:block;margin:0 auto 8px" aria-hidden="true"></i>Gagal memuat data (kode ${json.responseCode}).${isTemporaryError?'<br><small style="display:block;margin-top:6px;font-size:11px">Kemungkinan server JotForm sedang sibuk/gangguan sementara. Coba klik Segarkan beberapa saat lagi.</small>':''}</div>`;
      document.getElementById('syncLabel').textContent='Gagal memuat';
      return;
    }
    const data=(json.content||[]).map(mapSub);
    render(data);
    document.getElementById('syncLabel').textContent=`${data.length} laporan · ${new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}`;
  }catch(e){
    if(attempt<MAX_ATTEMPTS){
      await new Promise(r=>setTimeout(r,Math.min(3000*attempt,15000)));
      return init(attempt+1);
    }
    document.getElementById('root').innerHTML=`<div class="empty" style="color:#A32D2D;background:#FCEBEB;border-radius:12px"><i class="ti ti-wifi-off" style="font-size:22px;display:block;margin:0 auto 8px" aria-hidden="true"></i>Koneksi gagal. Kemungkinan disebabkan oleh pembatasan CORS.<br><small style="display:block;margin-top:6px;font-size:11px">${e.message}</small></div>`;
    document.getElementById('syncLabel').textContent='Gagal memuat';
  }
}

function cetakLaporan(){
  isPrinting=true;
  render(lastData);
  setTimeout(()=>{
    window.print();
    isPrinting=false;
    render(lastData);
  },80);
}

init();

</script>
